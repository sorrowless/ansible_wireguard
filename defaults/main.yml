---
# Configuration & data directory
wireguard_directory: /etc/wireguard
# Real server DNS name
wireguard_server_url: vpn.example.com
# Port to listen
wireguard_server_port: 51820
# Peers list
# wireguard_peers:
#   - name: peer
#     email: mail
wireguard_peers: []
# DNS servers for peers
wireguard_peers_dns: [8.8.8.8, 1.1.1.1]
# VPN network
wireguard_internal_subnet: 10.10.105.0/24
# Allowed IP addresses
wireguard_allowed_ips: 0.0.0.0/0
# Whether to log confs
wireguard_log_confs: true
# Docker-related networking settings
wireguard_docker_network_name: prom_network
# Labels assigned to docker container
wireguard_docker_labels: ['wireguard']

# Hairpin: full-tunnel clients send traffic for this host's public address into
# wg0. When both address and service_name are set, PostUp DNATs that traffic to
# a Docker/Swarm DNS name on the same network (resolved at interface up time).
# DNAT never fails wg-quick; DNS is retried briefly so peers can start first.
wireguard_hairpin_address: ""
wireguard_hairpin_service_name: ""
wireguard_hairpin_ports:
  - "80"
  - "443"
wireguard_hairpin_dns_retries: 15

wireguard_stock_postup: >-
  PostUp = iptables -A FORWARD -i %i -j ACCEPT;
  iptables -A FORWARD -o %i -j ACCEPT;
  iptables -t nat -A POSTROUTING -o eth+ -j MASQUERADE
wireguard_stock_postdown: >-
  PostDown = iptables -D FORWARD -i %i -j ACCEPT;
  iptables -D FORWARD -o %i -j ACCEPT;
  iptables -t nat -D POSTROUTING -o eth+ -j MASQUERADE

# Optionally email peer configs after creation:
# wireguard_mail:
#   host: smtp.google.com
#   port: 587
#   user: user
#   secret: password
#   subject: "VPN configuration"
#   body: "Your new VPN configuration is in attach"
