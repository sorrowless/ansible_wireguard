---
- name: Create a list of peer names
  ansible.builtin.set_fact:
    wireguard_peers_names: "{{ wireguard_peers | map(attribute='name') | list }}"
    list_of_existing_peer_dirs: []
    list_of_peer_dirs: []
    list_of_new_peer_dirs: []
    list_of_new_peer_names: []
    wireguard_new_peers: []

- name: Create configuration directory
  ansible.builtin.file:
    dest: "{{ wireguard_directory }}"
    state: directory
    # TODO(sbog): change it from 0777 to according 0755 and fix user/group ownership
    mode: 0700
    owner: root
    group: root

- name: Find existing peers
  ansible.builtin.find:
    paths: "{{ wireguard_directory }}"
    patterns: "peer_*"
    file_type: "directory"
  register: dirs

- name: Create a list of existing peer directories
  ansible.builtin.set_fact:
    list_of_existing_peer_dirs: "{{ list_of_existing_peer_dirs + [ item.path ] }}"
  with_items: "{{ dirs.files }}"

- name: Create a list of peer directoriers
  ansible.builtin.set_fact:
    list_of_peer_dirs: "{{ list_of_peer_dirs + [ wireguard_directory + '/peer_' + item ] }}"
  with_items: "{{ wireguard_peers_names }}"

- name: Create a list of new peer directories
  ansible.builtin.set_fact:
    list_of_new_peer_dirs: "{{ list_of_peer_dirs | difference(list_of_existing_peer_dirs) }}"

- name: Create a list of new peer names
  ansible.builtin.set_fact:
    list_of_new_peer_names: "{{ list_of_new_peer_names + [ item | split('/') | last | replace('peer_','') ] }}"
  with_items: "{{ list_of_new_peer_dirs }}"

- name: Create a list of new peers
  ansible.builtin.set_fact:
    wireguard_new_peers: "{{ wireguard_new_peers + [ item ] }}"
  when: item.name in list_of_new_peer_names
  loop: "{{ wireguard_peers }}"

- name: Start docker wireguard container
  community.docker.docker_compose_v2:
    project_name: wireguard
    definition:
      services:
        wireguard:
          image: "linuxserver/wireguard"
          container_name: "wireguard"
          ports:
            - "{{ wireguard_server_port }}:{{ wireguard_server_port }}/udp"
          volumes:
            - "/lib/modules:/lib/modules"
            - "{{ wireguard_directory }}:/config"
          hostname: "wireguard"
          restart: always
          labels: "{{ wireguard_docker_labels }}"
          cap_add:
            - NET_ADMIN
            - SYS_MODULE
          environment:
            - PUID=1000
            - PGID=1000
            - TZ=Europe/Moscow
            - "SERVERURL={{ wireguard_server_url }}"
            - "SERVERPORT={{ wireguard_server_port }}"
            - "PEERS={{ wireguard_peers_names | join(',') }}"
            - "PEERDNS={{ wireguard_peers_dns | join(',') }}"
            - "INTERNAL_SUBNET={{ wireguard_internal_subnet }}"
            - "ALLOWEDIPS={{ wireguard_allowed_ips }}"
            - "LOG_CONFS={{ wireguard_log_confs }}"
      networks:
        default:
          external: true
          name: "{{ wireguard_docker_network_name }}"

- name: Configure hairpin DNAT for full-tunnel clients
  when:
    - wireguard_hairpin_address | length > 0
    - (wireguard_hairpin_service_name | length > 0) or (wireguard_hairpin_host_ports | length > 0)
  vars:
    wireguard_hairpin_ports_csv: "{{ wireguard_hairpin_ports | join(',') }}"
    wireguard_stock_postup_line: "{{ wireguard_stock_postup | regex_replace('\\s+', ' ') | trim }}"
    wireguard_stock_postdown_line: "{{ wireguard_stock_postdown | regex_replace('\\s+', ' ') | trim }}"
    wireguard_hairpin_resolve: >-
      $(getent hosts {{ wireguard_hairpin_service_name }} | awk '{print $1; exit}')
    wireguard_hairpin_retry_seq: "{{ range(1, (wireguard_hairpin_dns_retries | int) + 1) | list | join(' ') }}"
  block:
    - name: Wait for WireGuard server template
      ansible.builtin.wait_for:
        path: "{{ wireguard_directory }}/templates/server.conf"

    - name: Wait for WireGuard live server config
      ansible.builtin.wait_for:
        path: "{{ wireguard_directory }}/wg_confs/wg0.conf"

    - name: Build in-container service hairpin PostUp and PostDown
      ansible.builtin.set_fact:
        wireguard_desired_postup: "{{ wireguard_stock_postup_line }}"
        wireguard_desired_postdown: "{{ wireguard_stock_postdown_line }}"

    - name: Append service DNAT to PostUp and PostDown
      when: wireguard_hairpin_service_name | length > 0
      ansible.builtin.set_fact:
        wireguard_desired_postup: >-
          {{ wireguard_desired_postup }};
          (
          TARGET_IP="";
          for _i in {{ wireguard_hairpin_retry_seq }}; do
          TARGET_IP={{ wireguard_hairpin_resolve }};
          if test -n "$TARGET_IP"; then break; fi;
          sleep 1;
          done;
          if test -n "$TARGET_IP"; then
          iptables -t nat -A PREROUTING -i %i -d {{ wireguard_hairpin_address }}
          -p tcp -m multiport --dports {{ wireguard_hairpin_ports_csv }}
          -j DNAT --to-destination "$TARGET_IP";
          fi
          ) || true
        wireguard_desired_postdown: >-
          {{ wireguard_desired_postdown }};
          (
          TARGET_IP={{ wireguard_hairpin_resolve }};
          if test -n "$TARGET_IP"; then
          iptables -t nat -D PREROUTING -i %i -d {{ wireguard_hairpin_address }}
          -p tcp -m multiport --dports {{ wireguard_hairpin_ports_csv }}
          -j DNAT --to-destination "$TARGET_IP";
          fi
          ) || true

    - name: Normalize desired PostUp and PostDown lines
      ansible.builtin.set_fact:
        wireguard_desired_postup: "{{ wireguard_desired_postup | regex_replace('\\s+', ' ') | trim }}"
        wireguard_desired_postdown: "{{ wireguard_desired_postdown | regex_replace('\\s+', ' ') | trim }}"

    - name: Ensure WireGuard server template PostUp and PostDown
      ansible.builtin.lineinfile:
        path: "{{ wireguard_directory }}/templates/server.conf"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - regexp: '^PostUp\s*='
          line: "{{ wireguard_desired_postup }}"
        - regexp: '^PostDown\s*='
          line: "{{ wireguard_desired_postdown }}"
      register: wireguard_hairpin_template

    - name: Ensure live WireGuard server config PostUp and PostDown
      ansible.builtin.lineinfile:
        path: "{{ wireguard_directory }}/wg_confs/wg0.conf"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - regexp: '^PostUp\s*='
          line: "{{ wireguard_desired_postup }}"
        - regexp: '^PostDown\s*='
          line: "{{ wireguard_desired_postdown }}"
      register: wireguard_hairpin_live

    - name: Restart WireGuard after PostUp and PostDown change
      community.docker.docker_container:
        name: wireguard
        state: started
        restart: true
      when: wireguard_hairpin_template is changed or wireguard_hairpin_live is changed

    - name: Ensure host hairpin REDIRECT for host-published ports
      when: wireguard_hairpin_host_ports | length > 0
      ansible.builtin.iptables:
        table: nat
        chain: PREROUTING
        in_interface: "{{ wireguard_hairpin_bridge_interface }}"
        destination: "{{ wireguard_hairpin_address }}/32"
        protocol: tcp
        destination_port: "{{ item }}"
        jump: REDIRECT
        comment: "wireguard-hairpin-host-{{ item }}"
        state: present
      loop: "{{ wireguard_hairpin_host_ports }}"


- name: Remove old peers' configs
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  with_items: "{{ list_of_existing_peer_dirs | default([]) | difference(list_of_peer_dirs) }}"

- name: Wait until the client confs is present before continuing
  ansible.builtin.wait_for:
    path: "{{ wireguard_directory }}/peer_{{ item }}/peer_{{ item }}.conf"
  with_items: "{{ wireguard_peers_names }}"
  tags: ['fetch_configs']

- name: Fetch configurations to localhost
  ansible.builtin.fetch:
    src: "{{ wireguard_directory }}/peer_{{ item }}/peer_{{ item }}.conf"
    dest: "/tmp/wireguard_vpn/peer_{{ item }}.conf"
    flat: yes
  with_items: "{{ wireguard_peers_names }}"
  tags: ['fetch_configs']

- name: Fetch qr codes to localhost
  ansible.builtin.fetch:
    src: "{{ wireguard_directory }}/peer_{{ item }}/peer_{{ item }}.png"
    dest: "/tmp/wireguard_vpn/peer_{{ item }}.png"
    flat: yes
  with_items: "{{ wireguard_peers_names }}"
  tags: ['fetch_configs']

- name: Send config to users email
  community.general.mail:
    host: "{{ wireguard_mail.host }}"
    port: "{{ wireguard_mail.port }}"
    username: "{{ wireguard_mail.user }}"
    sender: "{{ wireguard_mail.user }}"
    password: "{{ wireguard_mail.secret }}"
    to: "{{ item.email }}"
    subject: "{{ wireguard_mail.subject }}"
    body: "{{ wireguard_mail.body }}"
    attach:
      - "{{ wireguard_directory }}/peer_{{ item.name }}/peer_{{ item.name }}.conf"
      - "{{ wireguard_directory }}/peer_{{ item.name }}/peer_{{ item.name }}.png"
  when: item.email is defined and wireguard_mail.host is defined
  with_items: "{{ wireguard_new_peers }}"
  failed_when: False
  tags: ['fetch_configs']
